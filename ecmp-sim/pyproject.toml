[project]
name = "ecmpsim"
version = "0.1.0"
description = "Balls-into-bins simulator for ECMP groups and leaf-spine fabrics (COMP3821 project)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "pandas>=1.4", "matplotlib>=3.5", "scipy>=1.8"]

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ecmpsim"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
